
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Website Keren</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #74ebd5, #9face6);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .kartu {
            background: white;
            padding: 35px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 8px 20px #0002;
            max-width: 300px;
        }

        h1 {
            color: #5b5bd6;
        }

        p {
            color: #666;
            line-height: 1.6;
        }

        button {
            background: #5b5bd6;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 15px;
        }

        button:hover {
            background: #4141a8;
        }
    </style>
</head>
<body>

    <div class="kartu">
        <h1>Halo, Dunia! 👋</h1>
        <p>Selamat datang di website sederhana saya.
           Semoga harimu menyenangkan!</p>

        <button onclick="alert('Terima kasih sudah berkunjung! 😊')">
            Klik Saya
        </button>
    </div>

</body>
</html>
